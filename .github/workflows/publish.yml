name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write  # OIDC trusted publisher
      contents: write  # GitHub Release 발행

    steps:
      - uses: actions/checkout@v4
        with:
          # preflight의 지원 하한 fixture는 v0.9.84 tag에서 직접 읽는다.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # preflight 는 catalog·localization·upgrade 검사에서 프로젝트 의존성을 import 한다.
      # 이 단계가 없으면 세 검사가 ModuleNotFoundError 로 떨어지고, 그건 증거 불일치가 아니라
      # 환경 결손인데 화면에서는 구별되지 않는다. ci.yml 의 release_evidence 와 같은 환경을 만든다.
      - name: Install (editable + schema extra)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[schema]"

      - name: Publish preflight (증거 불일치면 여기서 차단 — publish 는 되돌릴 수 없다)
        run: python scripts/ci/publish_preflight.py --tag "${{ github.ref_name }}"
      - name: Install build tools
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      # 태그 push 는 PyPI 배포만 했고 GitHub Release 는 수동이라, v0.9.71~v0.9.73 이
      # 발행 누락으로 릴리즈 페이지에서 보이지 않았다. PyPI 배포 성공 뒤에만 발행한다
      # (배포 실패 릴리즈가 페이지에 남지 않게 순서 고정).
      #
      # 릴리즈가 이미 있으면 **그대로 둔다.** 사람이 먼저 만든 본문은 사후 생성된 노트보다
      # 정확하다 — 무엇이 왜 바뀌는지는 사이클이 알고 커밋 목록은 모른다. 없을 때만 만든다.
      #
      # 예전에는 무조건 `create` 였고, 본문을 태그 전에 확정한 릴리즈에서 이 단계가
      # `Release.tag_name already exists` 로 죽었다. PyPI 업로드는 이미 끝난 뒤라 배포는
      # 성공했는데 화면만 빨갰다 — 실패가 아닌 것을 실패로 보고하면 진짜 실패를 못 읽는다.
      - name: Create GitHub Release (본문이 이미 있으면 보존)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "릴리즈가 이미 있다 — 본문을 덮지 않는다: ${GITHUB_REF_NAME}"
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
