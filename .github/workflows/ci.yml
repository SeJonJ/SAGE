name: CI

# 외부검토 P2-10: 자기 도그푸딩(CI 부재) 해소 — push/PR 마다 hook 회귀 전체 + sage validate 자가검증 +
# sdist 패키징 리소스 가드를 실행한다.
on:
  push:
    branches: [main]
  # `labeled` 가 없으면 Windows 11 전용 job 은 **라벨을 붙여도 시작되지 않는다.** 라벨은
  # 이미 만들어진 run 의 조건으로만 읽히고, 라벨을 붙이는 행위 자체는 run 을 만들지 않기
  # 때문이다. 그러면 사용자는 라벨을 붙인 뒤 무의미한 빈 커밋을 밀어야 한다.
  # types 를 하나라도 적으면 기본값이 사라지므로 나머지 셋을 함께 적는다.
  pull_request:
    types: [opened, synchronize, reopened, labeled]

jobs:
  test:
    name: hook regression + self-validate (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
        with:
          # uninstall 회귀의 구버전 소비자 fixture 가 v0.9.84 tag 트리를 직접 꺼내 쓴다.
          # 얕게 받으면 그 검사가 조용히 skip 되고, skip 은 통과처럼 보인다.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (editable + schema extra)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[schema]"
      - name: Hook regression suite (run-all.sh)
        run: bash scripts/sage_harness/hooks/tests/run-all.sh
      - name: sage validate (self — drift/staleness + manifest schema)
        run: python -m sage validate --check --schema

  packaging:
    name: sdist build + resource bundle guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist
      - name: Assert engine resources bundled (MANIFEST.in 회귀 가드)
        run: python scripts/ci/check_sdist_resources.py dist
      - name: 순수 wheel 단독배포 게이트 (clean venv install→generate→validate, 번들만)
        run: bash scripts/ci/wheel_smoke.sh

  platform:
    # FR-R02: 같은 계약이 세 OS 에서 성립하는지 본다. **여기서 도는 것은 두 OS 다** — Windows
    # 몫은 아래 `windows11_uninstall` self-hosted job 이 같은 스크립트로 돌린다. GitHub-hosted
    # Windows 는 Server 2025 라 제품이 말하는 지원 범위 밖이고, 범위 밖 러너의 초록을 지원
    # 범위 증거로 세는 자리를 남기지 않기 위해 옮겼다.
    #
    # bash 를 쓰지 않는 순수 Python smoke 라 bash 가 없는 Windows 러너에서도 그대로 돈다 —
    # 검사 도구가 검사 대상보다 요구사항이 많으면 그 환경은 영원히 미검증으로 남는다.
    name: platform smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install (editable + schema extra)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[schema]"
      - name: Platform smoke (install · 한영 help · local preference · 문서 언어 · validate · hook 진입점 · encoding)
        run: python scripts/ci/platform_smoke.py

  uninstall_matrix:
    # 제거 명령을 두 OS × 세 Python 에서 돌린다. 되돌릴 수 없는 쪽으로 틀리는 명령이라, 한
    # 환경에서만 검증하고 배포하면 나머지 환경의 첫 사용자가 검사자가 된다.
    #
    # **갈림의 기준은 OS 이름이 아니라 제품이 스스로 내리는 판정이다.** 지원 범위
    # (POSIX · Windows 11 데스크톱 workstation · x64 · 64-bit Python · 로컬 NTFS)에서는 실제로
    # 설치하고 제거한다. 범위 밖에서는 제품이 mutation 을 거부하므로 그 **거부와 무변경**을
    # 검사한다. 이 matrix 는 지금 POSIX 두 OS 만 담으므로 언제나 실제 제거 쪽이다.
    #
    # **여기에 Windows 가 없는 이유.** GitHub-hosted Windows 러너는 Server 2025 이고, server SKU
    # 는 지원 범위 밖이다. 범위 밖 러너의 초록은 backend 회귀 증거일 뿐 데스크톱 증거가 될 수
    # 없는데 로그에서는 같은 초록으로 보인다 — 실제로 그것을 데스크톱 증거로 읽을 뻔했다.
    # 그래서 Windows 검증은 아래 `windows11_uninstall` self-hosted job 하나로 옮겼고, 이
    # matrix 는 그 착각의 자리를 아예 없앤다.
    #
    # Windows Server·도메인 컨트롤러·32-bit Python·ARM64 는 **명시적 미지원 범위**다. 그 환경을
    # 위한 native 구현을 더하지 않는다 — 검증할 수 없는 플랫폼 전용 코드는 막으려는 위험보다
    # 나쁘다는 것이 이 사이클의 전제다.
    name: uninstall consumer contract (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (editable + schema extra)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[schema]"
      # `SAGE_UNINSTALL_REQUIRE_MUTATION` 이 이 job 의 계약이다. 이것이 없으면 **실제 mutation
      # 0건으로 초록**이 되고, 화면에는 "검증했다" 만 남는다.
      - name: Uninstall smoke (project·global·all 실제 제거 + 명시 거부 fixture)
        env:
          SAGE_UNINSTALL_REQUIRE_MUTATION: "1"
        run: python scripts/ci/uninstall_smoke.py
      # race smoke 는 상위 경로 교체를 **실제로 주입**한다. 주입 없이 통과한 방어는 있다고
      # 말할 수 없다.
      - name: Uninstall race smoke (설계가 요구한 주입 자리 전부 — 외부 변경 0건)
        env:
          SAGE_UNINSTALL_REQUIRE_MUTATION: "1"
        run: python scripts/ci/uninstall_race_smoke.py
      # hook 회귀 job 은 ubuntu 하나다. 결속·capability·오류 표면·수동 안내 계약을 지키는
      # 검사들이 Windows 에서 한 번도 돌지 않았고, skip 을 세지 않으면 그 사실이 보이지
      # 않는다 — 지난 사이클에서 정확히 그 일이 있었다.
      - name: Uninstall core checks (핵심 계약 검사 + skip 0 단언)
        run: python scripts/ci/uninstall_core_checks.py

  windows11_uninstall:
    # **A7·A19 증거를 만드는 유일한 자리.** 정식 자동 제거 지원 범위는 Windows 11 데스크톱
    # workstation · x64 · 64-bit Python · 로컬 NTFS 이고, GitHub-hosted 러너에는 그 환경이 없다.
    # 그래서 self-hosted 전용 job 으로 둔다.
    #
    # **왜 라벨 제한인가.** self-hosted 러너는 남의 코드를 자기 머신에서 실행한다. fork PR 이
    # 여기에 닿으면 그 PR 의 workflow 가 러너를 그대로 가져간다. 그래서 조건은 같은 저장소의
    # PR 이면서(`head.repo.full_name == github.repository`) 사람이 승인했을 것을 요구한다.
    # 둘 중 하나만으로는 부족하다: 승인만 보면 fork PR 에서 열리고, 저장소만 보면 push 마다
    # 실제 제거가 도는 머신이 된다.
    #
    # **라벨은 상태가 아니라 사건이다.** 라벨이 "붙어 있는가" 로 보면 승인이 이후 커밋까지
    # 따라간다 — 검토한 커밋에 라벨을 붙여 한 번 돌린 뒤 새 커밋을 밀면, 라벨이 남아 있으므로
    # `synchronize` 에서 **검토하지 않은 코드가 자기 머신에서 자동 실행된다.** 한 번의 승인이
    # 무기한 재사용되는 것이고, 그것은 승인이 아니다.
    #
    # 그래서 이 job 은 `labeled` **사건 자체**에서만 열린다. 그 사건이 나른 라벨이 이
    # 라벨인지(`github.event.label.name`)까지 본다 — `contains(labels.*.name, ...)` 로 보면
    # 이미 라벨이 붙은 PR 에 **다른 라벨**을 하나 더 붙이는 것만으로 다시 열린다.
    #
    # 새 커밋을 검증하려면 라벨을 떼었다가 다시 붙인다. 손이 한 번 더 가는 것이 요점이다 —
    # 그 손이 "이 커밋을 내 머신에서 돌려도 좋다" 는 승인이다.
    name: windows 11 uninstall evidence (self-hosted, py${{ matrix.python-version }})
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'run-win11-uninstall' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, windows, x64, win11, sage-uninstall]
    # 이 job 은 읽기만 하면 된다. self-hosted 러너에서 쓰기 권한 토큰을 들고 도는 것은,
    # 실행되는 코드가 러너 머신뿐 아니라 저장소까지 건드릴 수 있다는 뜻이다.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
        with:
          # **승인한 커밋을 그대로 받는다.** `pull_request` 이벤트의 기본 checkout 은 base 와
          # 합친 merge 커밋이라, 증거가 어느 트리에서 만들어졌는지 되짚을 수 없다. A7·A19 는
          # "어느 커밋에서 돌았는가" 가 곧 증거의 내용이다.
          ref: ${{ github.event.pull_request.head.sha }}
          # self-hosted 러너는 작업 디렉터리가 job 사이에 남는다. 자격증명을 `.git/config` 에
          # 남기면 다음 job 이 그것을 물려받는다.
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (editable + schema extra)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[schema]"

      # **게이트가 맨 앞이다.** 진단 단계들은 "보고만 한다" 고 적혀 있지만 실제로는 native
      # 호출을 하고, capability report 의 `real_run()` 은 실제 install·uninstall 까지 돈다.
      # 그것들을 게이트보다 먼저 두면 **잘못 배정된 러너에서 막으려던 mutation 이 진단을 찍는
      # 과정에서 그대로 일어난다.** 순서가 곧 방어다.
      #
      # 게이트는 제품의 판정(`support_policy` · `capability`)을 직접 소비하고, 실패해도 자기
      # 근거(edition·build·product type·machine·process bits·native_floor·filesystem·gate
      # roots)를 전부 찍으므로 뒤 단계 없이도 원인을 되짚을 수 있다.
      # **어느 커밋에서 만든 증거인가.**
      #
      # `pull_request` 이벤트에서 `GITHUB_SHA` 는 base 와 합친 **merge 커밋**을 가리킬 수 있고,
      # 이 job 은 승인한 `head.sha` 를 일부러 checkout 한다. 그래서 **두 값은 정상적으로 다르다** —
      # 다르다는 사실 자체는 결함이 아니다. `GITHUB_SHA` 는 참고값으로만 찍는다.
      #
      # 검증 대상은 **승인 당시의 `head.sha` 하나**다. 확인해야 하는 것은 실제로 checkout 된
      # 트리가 그 커밋인가이고, 어긋나면 이 로그는 자기가 무엇을 검증했는지 말할 수 없으므로
      # 증거가 아니다 — 그래서 찍고 넘어가지 않고 여기서 실패한다.
      - name: Evidence commit (A7·A19 로그가 가리키는 트리)
        run: |
          $approvedHead = "${{ github.event.pull_request.head.sha }}"
          $checkedOut = git rev-parse HEAD
          echo "GITHUB_SHA=$env:GITHUB_SHA (merge commit for a pull_request event -- reference only)"
          echo "head.sha=$approvedHead"
          echo "checked out=$checkedOut"
          if ($checkedOut -ne $approvedHead) {
            throw "checked-out commit does not match the approved PR head"
          }
        shell: pwsh

      - name: Product-support gate (fail-closed — 여기서 막히면 아무것도 실행하지 않는다)
        env:
          # Windows 콘솔은 cp949/cp1252 로 열려 한글 출력이 물음표로 뭉개진다. 실패한 job 의
          # 출력이 읽히지 않으면 그 job 은 원인을 들고 있으면서도 말하지 못한다.
          PYTHONUTF8: "1"
        run: python scripts/ci/windows_capability_report.py --require-product-support

      # 실패한 native 호출의 **요인을 분리한다.** 소스만 읽어서는 여럿이 다 맞아 보이고,
      # 그중 하나가 틀렸을 때 어느 것인지 알 방법이 없다. 한 번에 한 요인만 바꿔 부른다.
      # 게이트를 통과한 뒤이므로 여기서 도는 native 호출은 지원 범위 안의 것이다.
      - name: Windows rename probe (요인 분리 — 게이트 아님)
        env:
          PYTHONUTF8: "1"
        run: python scripts/ci/windows_rename_probe.py

      - name: Windows capability diagnostics (판정 근거 — 게이트 아님)
        env:
          PYTHONUTF8: "1"
        run: python scripts/ci/windows_capability_report.py

      # 플랫폼 계약은 Python 하나면 충분하다 — 인터프리터 버전에 갈리는 계약이 아니다.
      - name: Platform smoke (install · 한영 help · local preference · 문서 언어 · validate · hook 진입점 · encoding)
        if: matrix.python-version == '3.12'
        env:
          PYTHONUTF8: "1"
        run: python scripts/ci/platform_smoke.py

      # `SAGE_UNINSTALL_REQUIRE_PRODUCT_SUPPORT` 는 `REQUIRE_MUTATION` 보다 한 칸 위의 요구다.
      # 후자는 정책이 막는 환경에서 **거부 계약 단언으로 갈음**하는 것을 허용한다. 여기서는
      # 그 갈음이 곧 위험이다 — 갈음이 열리면 이 job 은 실제 제거를 한 번도 하지 않은 채
      # A7 증거를 만들었다고 말한다. 그래서 정책 거부 1건, 실제 제거 0건, 세 scope 중 하나라도
      # 미실행이면 non-zero 다. 판정은 스크립트가 자기 실행 결과로 내린다 — workflow 가
      # stdout 을 grep 하지 않는 이유는, 어긋난 grep 이 **항상 통과**하기 때문이다.
      - name: Uninstall smoke (project·global·all 실제 제거 — 엄격 모드)
        env:
          SAGE_UNINSTALL_REQUIRE_PRODUCT_SUPPORT: "1"
          PYTHONUTF8: "1"
        run: python scripts/ci/uninstall_smoke.py

      # race smoke 는 상위 경로 교체를 **실제로 주입**한다. 주입 없이 통과한 방어는 있다고
      # 말할 수 없다 — Windows 에서 이 방어는 오래도록 한 번도 실행된 적이 없었다.
      - name: Uninstall race smoke (설계가 요구한 주입 자리 전부 — 외부 변경 0건)
        env:
          SAGE_UNINSTALL_REQUIRE_MUTATION: "1"
          PYTHONUTF8: "1"
        run: python scripts/ci/uninstall_race_smoke.py

      - name: Uninstall core checks (핵심 계약 검사 + skip 0 — 엄격 모드)
        env:
          # 이 단계가 없어서 runner 가 **실패를 찍다가** 죽었다. 검사 이름에 한글이 있고
          # 콘솔이 cp1252 라, 실제 FAIL 세 건이 `UnicodeEncodeError` 뒤에 가려졌다.
          SAGE_UNINSTALL_REQUIRE_PRODUCT_SUPPORT: "1"
          PYTHONUTF8: "1"
        run: python scripts/ci/uninstall_core_checks.py

  release_evidence:
    # publish 워크플로가 쓰는 것과 **같은 스크립트**를 PR 에서 먼저 돌린다. 릴리스 당일에만
    # 도는 검사는 릴리스 당일에 처음 실패한다.
    name: publish preflight (release evidence)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # preflight의 지원 하한 fixture는 v0.9.84 tag에서 직접 읽는다.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install (editable + schema extra)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[schema]"
      - name: Publish preflight (tag 대조는 릴리스에서만 — 여기서는 나머지 증거 일치)
        run: python scripts/ci/publish_preflight.py
